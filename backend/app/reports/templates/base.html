<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  :root { --ink:#1b2430; --muted:#5b6776; --line:#e3e8ef; --brand:#2b59c3; --soft:#f4f7fc; --good:#1c7c54; --bad:#b4372f; }
  * { box-sizing: border-box; }
  body { font: 14px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); margin: 0; padding: 32px 40px; background:#fff; }
  header { border-bottom: 3px solid var(--brand); padding-bottom: 12px; margin-bottom: 22px; }
  header .org { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  h1 { margin: 4px 0 2px; font-size: 26px; }
  header .meta { color: var(--muted); }
  h2 { font-size: 16px; margin: 26px 0 8px; color: var(--brand); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .kpis { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 4px; }
  .kpi { flex: 1 1 130px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .kpi b { display: block; font-size: 22px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  th { text-align: left; background: var(--soft); color: var(--muted); font-weight: 600; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-style: italic; }
  p { margin: 6px 0; }
  .up { color: var(--good); } .down { color: var(--bad); }
  footer { margin-top: 32px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; }
  @media print { body { padding: 0; } h2 { break-after: avoid; } table { break-inside: auto; } tr { break-inside: avoid; } }
</style>
</head>
<body>
<header>
  <div class="org">{{ company_name }}{% if client_name %} · prepared for {{ client_name }}{% endif %}</div>
  <h1>{{ title }}</h1>
  <div class="meta">{{ period.start|d }} – {{ period.end|d }}</div>
</header>
{% block body %}{% endblock %}
<footer>Generated by Project Transparency Platform</footer>
</body>
</html>

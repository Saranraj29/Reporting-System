name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests on PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium   # PDF export tests
      - run: ruff check .
      - name: Tests (migrations are applied by the test fixtures; RLS is exercised with a non-owner role)
        run: pytest
        env: { TEST_PG_ADMIN_DSN: "postgresql://postgres:postgres@localhost:5432/postgres" }

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (browser tour of the whole stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+psycopg://rs_app:rs_app@localhost:5432/reporting
      MIGRATION_DATABASE_URL: postgresql+psycopg://rs_owner:rs_owner@localhost:5432/reporting
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      PLATFORM_KEY: ci-platform-key
      STORAGE_DIR: /tmp/rs-files
      PG_URL: postgresql://rs_owner:rs_owner@localhost:5432/reporting
      SHOT_DIR: ${{ github.workspace }}/e2e-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Database
        run: psql -h localhost -U postgres -f infra/db/init.sql
      - name: Backend deps, migrations, demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          alembic upgrade head
          python -m app.seed
      - name: Start API and worker
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup python -m app.worker > ../worker.log 2>&1 &
      - name: Start web app
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --host 127.0.0.1 > ../web.log 2>&1 &
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8000/health && curl -sf localhost:5173 >/dev/null && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - name: Browser tour
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          node ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: e2e-screenshots
      - name: Service logs on failure
        if: failure()
        run: tail -n 80 api.log worker.log web.log

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }

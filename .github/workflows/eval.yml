name: AI golden set (nightly)

on:
  schedule: [{ cron: "30 2 * * *" }]
  workflow_dispatch: {}

jobs:
  eval:
    name: Golden set against the real model
    runs-on: ubuntu-latest
    if: ${{ vars.AI_EVAL_ENABLED == 'true' }}   # set once a provider key is approved (decision D-1)
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Run the golden set
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_REPORT_DIR: ${{ github.workspace }}
        run: pytest -m eval tests/test_evals_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval-report.json }

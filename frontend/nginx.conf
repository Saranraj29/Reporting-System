server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve `api` through Docker's DNS every few seconds. With a plain `proxy_pass http://api:8000;` nginx looks the
  # name up once at start-up, so after the api container is recreated (new IP) every request returns 502 until the web
  # container is restarted. A variable in proxy_pass + `resolver` makes nginx follow the new address.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
  }
  location /health { proxy_pass $api_upstream; }
  location / { try_files $uri /index.html; }
}

# Local stack: docker compose up --build   (web on http://localhost:8080, API docs on /api/docs)
# Development credentials only. In production use managed Postgres and a secret manager.
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://rs_app:rs_app@db:5432/reporting
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
  PLATFORM_KEY: ${PLATFORM_KEY:-dev-platform-key-change-me}
  PUBLIC_WEB_URL: http://localhost:8080
  WEB_ORIGIN: http://localhost:8080
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
  STORAGE_DIR: /data/files

services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://rs_owner:rs_owner@db:5432/reporting
    depends_on: { db: { condition: service_healthy } }

  api:
    build: ./backend
    environment: *api-env
    volumes: [files:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *api-env
    volumes: [files:/data/files]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  dbdata:
  files:
